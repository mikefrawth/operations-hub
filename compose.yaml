name: operationshub

services:
  web:
    image: operationshub-web:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__OperationsHub: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-operationshub};User=${MYSQL_USER:-operationshub};Password=${MYSQL_PASSWORD:-operationshub_dev_only};SslMode=Disabled;AllowPublicKeyRetrieval=True
      DataProtection__KeysPath: /var/lib/operationshub/keys
    ports:
      - "${APP_PORT:-5090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - data-protection-keys:/var/lib/operationshub/keys

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-operationshub}
      MYSQL_USER: ${MYSQL_USER:-operationshub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-operationshub_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-operationshub_root_dev_only}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  data-protection-keys:
  mysql-data:
