name: Validate and publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: operationshub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and format
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: operationshub
          MYSQL_USER: operationshub
          MYSQL_PASSWORD: operationshub_dev_only
          MYSQL_ROOT_PASSWORD: operationshub_root_dev_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=operationshub_root_dev_only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: ./eng/dotnet.sh restore OperationsHub.sln --verbosity minimal

      - name: Build without restore
        run: ./eng/dotnet.sh build OperationsHub.sln --no-restore --verbosity minimal

      - name: Run tests without rebuild
        env:
          OPERATIONS_HUB_TEST_CONNECTION: Server=127.0.0.1;Port=3307;Database=operationshub;User=operationshub;Password=operationshub_dev_only;SslMode=Disabled;AllowPublicKeyRetrieval=True
        run: ./eng/dotnet.sh test OperationsHub.sln --no-build --no-restore --verbosity minimal

      - name: Verify formatting
        run: ./eng/dotnet.sh format OperationsHub.sln --verify-no-changes --no-restore --verbosity minimal

  container-smoke:
    name: Build and smoke-test container
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build the web image
        run: docker compose build web

      - name: Start the database
        run: docker compose up --detach --wait mysql

      - name: Verify migration-only image mode
        run: docker compose run --rm --no-deps web --migrate

      - name: Verify migration-only mode does not initialize demo data
        shell: bash
        run: |
          demo_state="$(docker compose exec --no-TTY mysql \
            mysql \
              --batch \
              --skip-column-names \
              --user=operationshub \
              --password=operationshub_dev_only \
              operationshub \
              --execute="
                SELECT CONCAT(
                  (SELECT COUNT(*)
                   FROM AspNetUsers
                   WHERE Id IN (
                     '10000000-0000-4000-8000-000000000001',
                     '10000000-0000-4000-8000-000000000002',
                     '10000000-0000-4000-8000-000000000003',
                     '10000000-0000-4000-8000-000000000004')
                     AND PasswordHash IS NOT NULL),
                  ':',
                  (SELECT COUNT(*)
                   FROM AspNetUserRoles
                   WHERE UserId IN (
                     '10000000-0000-4000-8000-000000000001',
                     '10000000-0000-4000-8000-000000000002',
                     '10000000-0000-4000-8000-000000000003',
                     '10000000-0000-4000-8000-000000000004')),
                  ':',
                  (SELECT COUNT(*)
                   FROM service_requests
                   WHERE id = '40000000-0000-4000-8000-000000000001'));")"

          if [ "$demo_state" != "0:0:0" ]; then
            echo "Migration-only mode initialized demo data: $demo_state"
            exit 1
          fi

      - name: Start the web application
        run: docker compose up --detach web

      - name: Wait for readiness and smoke-test public routes
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:5090/health/ready; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "The application did not become ready."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:5090/health/live
          curl --fail --silent --show-error http://localhost:5090/ | grep --fixed-strings "OperationsHub"
          curl --fail --silent --show-error http://localhost:5090/_framework/blazor.web.js > /dev/null

      - name: Collect container diagnostics
        if: always()
        run: docker compose logs --no-color

      - name: Remove local stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-image:
    name: Publish immutable container image
    needs: container-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$IMAGE_REPOSITORY")"
          docker buildx build \
            --file Dockerfile \
            --tag "$image:sha-$IMAGE_REVISION" \
            --tag "$image:latest" \
            --push \
            .
