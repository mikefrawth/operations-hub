name: Validate and publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: operationshub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and format
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: ./eng/dotnet.sh restore OperationsHub.sln --verbosity minimal

      - name: Build without restore
        run: ./eng/dotnet.sh build OperationsHub.sln --no-restore --verbosity minimal

      - name: Run tests without rebuild
        run: ./eng/dotnet.sh test OperationsHub.sln --no-build --no-restore --verbosity minimal

      - name: Verify formatting
        run: ./eng/dotnet.sh format OperationsHub.sln --verify-no-changes --no-restore --verbosity minimal

  container-smoke:
    name: Build and smoke-test container
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start the local stack
        run: docker compose up --build --detach

      - name: Wait for readiness and smoke-test public routes
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:5090/health/ready; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "The application did not become ready."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://localhost:5090/health/live
          curl --fail --silent --show-error http://localhost:5090/ | grep --fixed-strings "OperationsHub"
          curl --fail --silent --show-error http://localhost:5090/_framework/blazor.web.js > /dev/null

      - name: Verify migration-only image mode
        run: docker compose run --rm web --migrate

      - name: Collect container diagnostics
        if: always()
        run: docker compose logs --no-color

      - name: Remove local stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-image:
    name: Publish immutable container image
    needs: container-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< "$IMAGE_REPOSITORY")"
          docker buildx build \
            --file Dockerfile \
            --tag "$image:sha-$IMAGE_REVISION" \
            --tag "$image:latest" \
            --push \
            .
